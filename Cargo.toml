[package]
name = "notiz"
version = "0.2.0"
edition = "2024"
description = "A small native plain text notes app"

[dependencies]
directories = "6"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
global-hotkey = "0.8.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
